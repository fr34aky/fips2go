[package]
name = "fips-android-shim"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# JNI shim embedding the fips node for the Android app:
# - `cdylib` → libfips_android.so loaded from Kotlin
# - `lib`    → host-side unit/integration tests of the engine, pump, and DNS
#              proxy (everything except the JNI surface itself)
[lib]
name = "fips_android"
crate-type = ["cdylib", "lib"]

[dependencies]
# fips plus what the app needs and upstream does not have yet (the public
# read handle for node status, TunPacketProcessor, show_lan_peers,
# mDNS exclude_addrs, UDP share_port and dial_prefixes, relay status, the
# Nostr discovery ceiling) — the `android-hooks` branch of the fr34aky/fips
# fork, pinned. The crate is published as `fips-mesh` (library name `fips`), so
# the dependency renames it. For local fips development, override with:
#   [patch."https://github.com/fr34aky/fips"]
#   fips-mesh = { path = "../fips" }
fips = { git = "https://github.com/fr34aky/fips", rev = "8b8433a", package = "fips-mesh", default-features = false }
ipstack = "1"
jni = "0.21"
# Public domain names over fips (www.example.org → a mesh node): the policy
# core and the resolver adapters from fr34aky/fips-pub-domains, pinned like fips.
# The phone-only parts (mesh transport, responder registration) are
# names.rs / meshudp.rs here.
pubdom-core = { git = "https://github.com/fr34aky/fips-pub-domains", rev = "8a64884" }
pubdom-resolve = { git = "https://github.com/fr34aky/fips-pub-domains", rev = "8a64884" }
# Exit adverts (exitfind.rs) are fetched with the relay client the tree
# already has through fips and pubdom-resolve: same version, same features.
nostr-sdk = { version = "0.44", default-features = false }
libc = "0.2"
# The control socket's connect needs a deadline std does not offer. Already
# in the tree through tokio, at this version.
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Loopback websocket server standing in for a relay in the engine test
# (same tungstenite the tree already carries via nostr-sdk; no TLS features).
tungstenite = { version = "0.26", default-features = false }
# The userspace peer in the meshudp echo test answers echo requests by
# itself; real nodes answer through their kernels. Test builds only.
smoltcp = { version = "0.14.0", default-features = false, features = ["auto-icmp-echo-reply"] }

[profile.release]
strip = true
