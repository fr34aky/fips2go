# 16 KB page alignment for the native lib. Android 15+ on Pixel 9-class
# hardware runs with 16 KB memory pages and rejects (or warns on) .so files
# whose LOAD segments are only 4 KB-aligned. NDK r27's lld defaults to 4 KB;
# this forces the larger max-page-size so segments align to 0x4000.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
