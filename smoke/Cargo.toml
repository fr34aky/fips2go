[package]
name = "fips-smoke"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Phase 1 smoke test for the Android port:
# - on the host: runs two in-process nodes wired through the app-owned TUN
#   seam (`Node::enable_app_owned_tun`) and pushes a packet end-to-end.
# - cross-compiled for aarch64-linux-android: proves the fips library and a
#   full binary link with the NDK toolchain.
[dependencies]
# fips with the Android embedder hooks — fr34aky/fips @ android-hooks, pinned.
fips = { git = "https://github.com/fr34aky/fips", rev = "80ad19d", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
